<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Salary Entry</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#182033}header{background:linear-gradient(135deg,#5540cf,#765be7);color:#fff;padding:20px}.head,.wrap{max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{padding:20px 16px}.card{background:#fff;border:1px solid #e3e6ef;border-radius:15px;padding:18px;box-shadow:0 6px 24px #2220400b}.login{max-width:410px;margin:80px auto}.login input{width:100%;margin:6px 0;height:40px;padding:0 10px;border:1px solid #dfe2eb;border-radius:8px}.msg{min-height:20px;color:#c0392b;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.controls{display:grid;grid-template-columns:140px 140px minmax(180px,260px) 1fr;gap:10px;margin-top:16px}.controls input,.controls select{height:42px;border:1px solid #dfe2eb;border-radius:8px;padding:0 10px}.apply{background:#5b45d8;color:white;border:0;border-radius:8px;padding:0 14px;font-weight:bold}.tablewrap{overflow:auto;margin-top:18px;border:1px solid #e4e7ef;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#f7f4ff;padding:12px;text-align:left;font-size:12px}td{padding:9px 10px;border-top:1px solid #edf0f4;font-size:13px}td input[type=number]{width:130px;height:36px;border:1px solid #dfe2eb;border-radius:7px;padding:0 8px}.muted{color:#727b8f;font-size:12px}.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}.save{background:#198754;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-weight:bold}.status{font-size:13px}.empty{text-align:center;padding:50px;color:#727b8f}.hidden{display:none}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.apply{height:42px}.toolbar{align-items:flex-start}}</style></head><body><div id="login" class="login card"><h1>Bulk Salary Entry</h1><p>Manager login</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div id="msg" class="msg"></div><button class="apply" style="width:100%;height:42px" onclick="signin()">Sign In</button></div><div id="app" class="hidden"><header><div class="head"><div><h1>Bulk Monthly Salary</h1><div style="opacity:.85">Enter payable salary for many members at once</div></div><button onclick="location.href='index.html'" style="border:0;border-radius:8px;padding:10px 14px">← Dashboard</button></div></header><div class="wrap"><div class="card"><div class="toolbar"><div><h2>Bulk Salary Entry</h2><div class="muted">Choose a month, set a default payable amount, adjust exceptions, then save.</div></div><div id="count" class="muted"></div></div><div class="controls"><select id="year"></select><select id="month"></select><input id="defaultAmount" type="number" min="0" placeholder="Default payable amount"><input id="search" placeholder="Search name or designation..." oninput="renderTable()"><button class="apply" onclick="applyDefault()">Apply Amount to Selected</button></div><div class="controls" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-top:10px"><select id="department" onchange="renderTable()"><option value="">All departments</option></select><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"> Select all visible</label><button onclick="clearAmounts()">Clear selected</button><button onclick="loadRecords()">Reload saved values</button></div><div class="tablewrap"><table><thead><tr><th><input id="headAll" type="checkbox" onchange="toggleAll(this.checked)"></th><th>Member</th><th>Designation</th><th>Department</th><th>Payable (₹)</th><th>Already Paid (₹)</th><th>Due (₹)</th></tr></thead><tbody id="rows"></tbody></table></div><div class="savebar"><div id="status" class="status">Ready</div><button class="save" onclick="saveBulk()">Save All Selected</button></div></div></div></div><script>const SUPABASE_URL='https://ryqfahoiedgdpbbuuknb.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWZhaG9pZWRnZHBiYnV1a25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTEwMzksImV4cCI6MjEwNDA2NzAzOX0.ZvmZMR2gfKLsvuxkKHfB_XuDYjZ3eo2u4fQnF8LQS0g';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let members=[],records=new Map(),user=null;const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');async function signin(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').textContent='Enter email and password.';let r=await db.auth.signInWithPassword({email,password});if(r.error)$('msg').textContent=r.error.message}async function signout(){await db.auth.signOut()}db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');init()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});function init(){let now=new Date(),y=now.getFullYear();$('year').innerHTML='';for(let i=2019;i<=y+5;i++)$('year').innerHTML+=`<option>${i}</option>`;$('month').innerHTML=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');$('month').value=now.getMonth()+1;loadMembers()}async function loadMembers(){let r=await db.from('people').select('*').order('name');if(r.error)return setStatus(r.error.message,true);members=r.data;let ds=[...new Set(members.map(x=>x.department||'Unassigned'))].sort();$('department').innerHTML='<option value="">All departments</option>'+ds.map(d=>`<option>${esc(d)}</option>`).join('');renderTable();loadRecords()}async function loadRecords(){let y=+$('year').value,m=+$('month').value;r=await db.from('salary_records').select('person_id,payable,paid').eq('year',y).eq('month',m);if(r.error)return setStatus(r.error.message,true);records=new Map(r.data.map(x=>[x.person_id,x]));renderTable()}function filtered(){let q=$('search').value.toLowerCase(),d=$('department').value;return members.filter(p=>(!d||(p.department||'Unassigned')===d)&&(!q||p.name.toLowerCase().includes(q)||String(p.role||'').toLowerCase().includes(q)))}function renderTable(){let arr=filtered();$('count').textContent=arr.length+' members shown';$('rows').innerHTML=arr.map(p=>{let x=records.get(p.id)||{},pay=x.payable||0,paid=x.paid||0;return `<tr data-id="${p.id}"><td><input class="pick" type="checkbox" checked></td><td><b>${esc(p.name)}</b></td><td>${esc(p.role||'')}</td><td>${esc(p.department||'Unassigned')}</td><td><input class="amount" type="number" min="0" value="${pay}"></td><td>${money(paid)}</td><td class="due">${money(Math.max(0,pay-paid))}</td></tr>`}).join('');document.querySelectorAll('.amount').forEach(i=>i.addEventListener('input',()=>{let tr=i.closest('tr'),paid=+(records.get(tr.dataset.id)?.paid||0),due=Math.max(0,(+i.value||0)-paid);tr.querySelector('.due').textContent=money(due)}))}function toggleAll(v){document.querySelectorAll('#rows .pick').forEach(x=>x.checked=v);$('selectAll').checked=v;$('headAll').checked=v}function applyDefault(){let v=+$('defaultAmount').value||0;document.querySelectorAll('#rows tr').forEach(tr=>{if(tr.querySelector('.pick').checked){tr.querySelector('.amount').value=v;let paid=+(records.get(tr.dataset.id)?.paid||0);tr.querySelector('.due').textContent=money(Math.max(0,v-paid))}})}function clearAmounts(){document.querySelectorAll('#rows tr').forEach(tr=>{if(tr.querySelector('.pick').checked){tr.querySelector('.amount').value=0;tr.querySelector('.due').textContent=money(0)}})}async function saveBulk(){let y=+$('year').value,m=+$('month').value,rows=[...document.querySelectorAll('#rows tr')].filter(tr=>tr.querySelector('.pick').checked);if(!rows.length)return setStatus('Select at least one member.',true);setStatus('Saving...');let payload=rows.map(tr=>{let id=tr.dataset.id,old=records.get(id)||{};return{person_id:id,year:y,month:m,payable:+tr.querySelector('.amount').value||0,paid:+old.paid||0,payment_date:old.payment_date||null}});let r=await db.from('salary_records').upsert(payload,{onConflict:'person_id,year,month'});if(r.error)return setStatus(r.error.message,true);setStatus('✓ All selected salaries saved online.');await loadRecords()}function setStatus(t,err=false){$('status').textContent=t;$('status').style.color=err?'#c0392b':''}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
